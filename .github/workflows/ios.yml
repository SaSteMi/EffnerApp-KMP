name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          xcodebuild -version
          ./gradlew --version

      - name: Verify Xcode project
        run: |
          xcodebuild \
            -list \
            -project "iosApp/iosApp.xcodeproj"

      - name: Build iOS app without code signing
        run: |
          set -o pipefail

          xcodebuild \
            -project "iosApp/iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Locate built app
        run: |
          echo "Available app bundles:"

          find "$GITHUB_WORKSPACE/build-ios" \
            -type d \
            -name "*.app" \
            -print

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          APP_PATH="$(find \
            "$GITHUB_WORKSPACE/build-ios/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was found."
            exit 1
          fi

          echo "Using app bundle: $APP_PATH"

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -r "$GITHUB_WORKSPACE/EffnerApp-unsigned.ipa" Payload

          echo "Created IPA:"
          ls -lh "$GITHUB_WORKSPACE/EffnerApp-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EffnerApp-iOS-unsigned
          path: EffnerApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
